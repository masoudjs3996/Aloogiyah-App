# Bootstrap HTTP configuration. Certbot adds HTTPS after domain validation.
# Install on the VPS host: /etc/nginx/sites-available/aloogiyah
map $http_upgrade $aloogiyah_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name api.aloogiyah.ir;
    client_max_body_size 52m;

    location / {
        proxy_pass http://127.0.0.1:5056;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aloogiyah_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name aloogiyah.ir;
    client_max_body_size 52m;

    location /api/ {
        proxy_pass http://127.0.0.1:5056/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.aloogiyah.ir;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
